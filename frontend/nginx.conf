server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend service. The browser only ever talks to this
  # origin (same-origin). The trailing slash on proxy_pass strips the /api prefix,
  # mirroring the Vite dev proxy rewrite (/api/foo -> /foo on the backend).
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: client-side routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
