services:
  db:
    image: postgres:16
    container_name: secrets_db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: secrets_manager
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: secrets_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
